[project]
name = "virtuosa"
version = "0.1.0"
description = ""
authors = [
    {name = "dnl-strnl", email = "129630837+dnl-strnl@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0"

[tool.poetry]
packages = [{include = "virtuosa", from = "src"}]

[tool.poetry.dependencies]
mutagen = ">=1.47.0,<2.0.0"
flask = ">=3.1.0,<4.0.0"
torch = ">=2.6.0,<3.0.0"
numba = "^0.61.0"
openai-whisper = ">=20250625"
ollama = ">=0.5.1,<1.0.0"

# `poetry install --with make` for the stable-audio demo.
[tool.poetry.group.make]
optional = true

[tool.poetry.group.make.dependencies]
diffusers = ">=0.32.2,<0.33.0"
soundfile = ">=0.13.1,<0.14.0"
transformers = ">=4.48.2,<5.0.0"
accelerate = ">=1.3.0,<2.0.0"
torchsde = ">=0.2.6,<0.3.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
