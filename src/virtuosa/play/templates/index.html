<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtuosa</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎻</text></svg>">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="player-container">
        <aside class="sidebar">
            <h1>Virtuosa</h1>
            <p class="library-stats">{{ "{:,}".format(track_count) }} tracks · {{ artist_count }} artists</p>
            <button id="new-playlist-btn">+ New playlist</button>
            <ul id="playlist-list" class="playlist-list"></ul>
        </aside>

        <main class="main-content">
            <section class="command">
                <!-- a microphone for a new playlist, a pencil while editing one -->
                <button id="voice-playlist-btn" class="voice-btn">
                    <svg class="mic-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <rect x="9" y="3" width="6" height="11" rx="3"></rect>
                        <path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path>
                    </svg>
                    <svg class="edit-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19l-4 1z"></path>
                        <path d="M14.5 6.5l3 3"></path>
                    </svg>
                </button>
                <form id="command-form">
                    <input id="command-input" type="text" autocomplete="off">
                    <button type="submit">Send</button>
                </form>
            </section>
            <p id="recording-status" class="recording-status"></p>
            <ul id="activity" class="activity"></ul>

            <header class="playlist-header">
                <div>
                    <h2 id="playlist-name"></h2>
                    <p id="playlist-meta" class="playlist-meta"></p>
                </div>
                <button id="delete-playlist-btn" class="quiet" hidden>Delete</button>
            </header>
            <ol id="track-list" class="track-list"></ol>
        </main>

        <footer class="player-controls">
            <button id="prev-btn" title="Previous">&#9198;</button>
            <button id="next-btn" title="Next">&#9197;</button>
            <div id="now-playing" class="now-playing">Nothing playing</div>
            <audio id="audio-player" controls></audio>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
